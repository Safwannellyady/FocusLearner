name: Build Android APK
on:
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub Actions tab
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install Dependencies & Sync
        run: |
          npm install
          mkdir -p www
          npx cap add android || true
          npx cap sync
      - name: Compile APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
