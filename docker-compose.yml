version: "3.9"

services:

  # PostgreSQL 16 - persistent relational database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-focuslearner}
      POSTGRES_USER:     ${POSTGRES_USER:-focususer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focususer} -d ${POSTGRES_DB:-focuslearner}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Flask / Gunicorn backend API - internal only
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_ENV:    production
      FLASK_DEBUG:  "False"
      PORT:         "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-focususer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-focuslearner}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # React / Nginx frontend - exposed to the outside world
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - app_net

volumes:
  postgres_data:
  uploads_data:

networks:
  app_net:
    driver: bridge
