server {
    listen 80;
    server_name localhost;

    # ---------------------------------------------------------------------------
    # Static React App (SPA fallback)
    # All routes not matched below fall through to index.html so that
    # React Router can handle client-side navigation.
    # ---------------------------------------------------------------------------
    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------
    # Reverse proxy: forward /api/* calls to the backend container.
    # Docker Compose puts both services on the same network; "backend" resolves
    # to the Flask/Gunicorn container automatically.
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;

        # WebSocket / upgrade support (future-proofing)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass real client info to Flask
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------------------
    # Long-lived cache for content-hashed static assets (JS/CSS bundles)
    # CRA appends a hash to every filename so this is safe to cache forever.
    # ---------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root    /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "DENY"            always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip            on;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;

    # ---------------------------------------------------------------------------
    # Lightweight health check endpoint for Docker / load-balancer probes
    # ---------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
